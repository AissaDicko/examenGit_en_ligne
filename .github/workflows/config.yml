name: Verification_Examen

on: [push]  # Le robot se réveille à chaque push

jobs:
  test-du-jeu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3  # Le robot télécharge ton code
      - name: Installer Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Lancer les tests unitaires
        run: python -m unittest test_mesfonctions.py